[package]
name = "theresavdb-client"
version = "0.1.1"
edition = "2021"
authors = ["TheresavDB Contributors"]
license = "Apache-2.0"
description = "Official async Rust client library for TheresavDB relational database"
repository = "https://github.com/Blckrose08/theresavdb"
readme = "README.md"
keywords = ["database", "rdbms", "theresavdb", "sql", "client"]
categories = ["database"]

[dependencies]
tokio = { version = "1.43", features = ["net", "io-util"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
byteorder = "1.5"
thiserror = "2.0"
