[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "theresavdb"
version = "0.1.1"
description = "Pure Python client for TheresavDB relational database"
readme = "README.md"
requires-python = ">=3.8"
dependencies = []
authors = [{ name = "TheresavDB Contributors", email = "core@theresav.eu" }]
keywords = ["theresavdb", "sql", "database", "rdbms"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Database :: Database Engines/Servers",
]
