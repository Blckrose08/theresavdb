[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/error",
    "crates/types",
    "crates/page",
    "crates/storage",
    "crates/buffer-pool",
    "crates/wal",
    "crates/index",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["TheresavDB Contributors"]
license = "Apache-2.0"
repository = "https://github.com/theresav/theresavdb"
rust-version = "1.80"

[workspace.dependencies]
thiserror = "2.0"
crc32c = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.15", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1.36", features = ["serde"] }
proptest = "1.6"
byteorder = "1.5"
tempfile = "3.27"
libc = "0.2"

# Internal crates
theresav_common = { path = "crates/common" }
theresav_error = { path = "crates/error" }
theresav_types = { path = "crates/types" }
theresav_page = { path = "crates/page" }
theresav_storage = { path = "crates/storage" }
